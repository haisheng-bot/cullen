<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenStock AI 实时走势</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fa;
        color: #18212f;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px 20px 40px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 14px;
        border: 1px solid #d8dee8;
        background: #ffffff;
        border-radius: 8px;
      }

      label {
        font-size: 13px;
        color: #4e5b6d;
      }

      input,
      select,
      button {
        height: 38px;
        border-radius: 6px;
        border: 1px solid #c9d2df;
        padding: 0 10px;
        font-size: 14px;
        background: #fff;
      }

      button {
        border-color: #1d4ed8;
        background: #1d4ed8;
        color: white;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .chart-shell {
        margin-top: 16px;
        border: 1px solid #d8dee8;
        background: #ffffff;
        border-radius: 8px;
        padding: 16px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        min-height: 24px;
        color: #4e5b6d;
        font-size: 13px;
        margin-bottom: 12px;
      }

      canvas {
        display: block;
        width: 100%;
        height: 420px;
        border: 1px solid #edf0f5;
        border-radius: 6px;
      }

      .status {
        min-height: 22px;
        margin-top: 12px;
        color: #526070;
        font-size: 13px;
      }

      .disclaimer {
        margin-top: 14px;
        color: #7a2635;
        font-size: 13px;
      }

      @media (max-width: 720px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        canvas {
          height: 320px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>实时走势</h1>
        </div>
        <form class="controls" id="trend-form">
          <label>
            股票
            <input id="symbol" value="AAPL" maxlength="16" />
          </label>
          <label>
            范围
            <select id="range">
              <option value="1d">1d</option>
              <option value="5d">5d</option>
              <option value="1mo">1mo</option>
              <option value="3mo">3mo</option>
              <option value="6mo">6mo</option>
              <option value="1y">1y</option>
            </select>
          </label>
          <label>
            间隔
            <select id="interval">
              <option value="1m">1m</option>
              <option value="5m">5m</option>
              <option value="15m">15m</option>
              <option value="60m">60m</option>
              <option value="1d">1d</option>
            </select>
          </label>
          <button id="load-button" type="submit">刷新</button>
        </form>
      </header>

      <section class="chart-shell">
        <div class="meta" id="meta"></div>
        <canvas id="trend-chart" width="1040" height="420"></canvas>
        <div class="status" id="status"></div>
        <div class="disclaimer" id="disclaimer">本系统仅用于投资研究辅助，不构成任何投资建议。</div>
      </section>
    </main>

    <script>
      const API_BASE = "http://127.0.0.1:8000";
      const form = document.getElementById("trend-form");
      const symbolInput = document.getElementById("symbol");
      const rangeInput = document.getElementById("range");
      const intervalInput = document.getElementById("interval");
      const button = document.getElementById("load-button");
      const canvas = document.getElementById("trend-chart");
      const ctx = canvas.getContext("2d");
      const meta = document.getElementById("meta");
      const status = document.getElementById("status");
      const disclaimer = document.getElementById("disclaimer");

      function resizeCanvas() {
        const ratio = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.floor(rect.width * ratio);
        canvas.height = Math.floor(rect.height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function drawChart(points) {
        resizeCanvas();
        const rect = canvas.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        ctx.clearRect(0, 0, width, height);

        if (!points.length) return;

        const padding = { top: 24, right: 24, bottom: 34, left: 58 };
        const values = points.map((point) => point.close);
        const min = Math.min(...values);
        const max = Math.max(...values);
        const span = max - min || 1;
        const plotWidth = width - padding.left - padding.right;
        const plotHeight = height - padding.top - padding.bottom;

        ctx.strokeStyle = "#e5e9f0";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i <= 4; i += 1) {
          const y = padding.top + (plotHeight / 4) * i;
          ctx.moveTo(padding.left, y);
          ctx.lineTo(width - padding.right, y);
        }
        ctx.stroke();

        ctx.fillStyle = "#607086";
        ctx.font = "12px system-ui";
        for (let i = 0; i <= 4; i += 1) {
          const value = max - (span / 4) * i;
          const y = padding.top + (plotHeight / 4) * i + 4;
          ctx.fillText(value.toFixed(2), 10, y);
        }

        ctx.strokeStyle = values[values.length - 1] >= values[0] ? "#138a52" : "#c24135";
        ctx.lineWidth = 2;
        ctx.beginPath();
        points.forEach((point, index) => {
          const x = padding.left + (plotWidth * index) / Math.max(points.length - 1, 1);
          const y = padding.top + plotHeight - ((point.close - min) / span) * plotHeight;
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        ctx.fillStyle = "#18212f";
        ctx.font = "13px system-ui";
        ctx.fillText(points[0].timestamp.slice(11, 16), padding.left, height - 12);
        ctx.fillText(
          points[points.length - 1].timestamp.slice(11, 16),
          width - padding.right - 40,
          height - 12,
        );
      }

      async function loadTrend() {
        const symbol = symbolInput.value.trim().toUpperCase() || "AAPL";
        const range = rangeInput.value;
        const interval = intervalInput.value;
        const url = `${API_BASE}/stocks/${encodeURIComponent(symbol)}/trend?range=${range}&interval=${interval}`;

        button.disabled = true;
        status.textContent = "正在读取实时走势...";
        try {
          const response = await fetch(url);
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.detail || `HTTP ${response.status}`);
          }
          const data = await response.json();
          drawChart(data.points || []);
          meta.textContent = `${data.symbol} · ${data.exchange_name || "N/A"} · ${data.currency || "N/A"} · 点数 ${data.points.length} · 来源 ${data.source}`;
          disclaimer.textContent = data.risk_disclaimer;
          status.textContent = `更新时间 ${new Date(data.analysis_time).toLocaleString()}`;
        } catch (error) {
          status.textContent = `读取失败：${error.message}`;
        } finally {
          button.disabled = false;
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        loadTrend();
      });
      window.addEventListener("resize", loadTrend);
      loadTrend();
      window.setInterval(loadTrend, 60000);
    </script>
  </body>
</html>
