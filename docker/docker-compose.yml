services:
  postgres:
    image: postgres:16-alpine
    container_name: openstock-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openstock
      POSTGRES_PASSWORD: openstock
      POSTGRES_DB: openstock_ai
    ports:
      - "5432:5432"
    volumes:
      - openstock_ai_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: openstock-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  openstock_ai_postgres_data:
